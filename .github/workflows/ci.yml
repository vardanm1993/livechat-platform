name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality-and-tests:
    name: Backend Quality and Tests
    runs-on: ubuntu-24.04

    services:
      pgsql:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: livechat_platform
          POSTGRES_USER: sail
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sail -d livechat_platform"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_NAME: Livechat Platform
      APP_ENV: testing
      APP_KEY: base64:dGVzdGluZy1rZXktZm9yLWxhcmF2ZWwtYXBwLTEyMzQ=
      APP_DEBUG: false
      APP_URL: http://localhost

      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: livechat_platform
      DB_USERNAME: sail
      DB_PASSWORD: password

      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379

      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_pgsql, pgsql
          coverage: none

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application environment
        run: cp .env.example .env

      - name: Run PHP code style checks
        run: composer lint

      - name: Run static analysis
        run: composer analyse

      - name: Run Rector dry-run
        run: composer refactor:dry

      - name: Run database migrations
        run: php artisan migrate --force

      - name: Run backend tests
        run: php artisan test

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Type-check frontend
        run: npm run typecheck

      - name: Build frontend assets
        run: npm run build
