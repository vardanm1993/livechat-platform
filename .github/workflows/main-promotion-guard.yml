name: Main Promotion Guard

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  main-promotion-guard:
    name: Main Promotion Guard
    runs-on: ubuntu-24.04

    steps:
      - name: Validate source branch for main promotion
        env:
          SOURCE_BRANCH: ${{ github.head_ref }}
          TARGET_BRANCH: ${{ github.base_ref }}
        run: |
          echo "Source branch: ${SOURCE_BRANCH}"
          echo "Target branch: ${TARGET_BRANCH}"

          if [[ "${TARGET_BRANCH}" != "main" ]]; then
            echo "This guard only applies to pull requests targeting main."
            exit 0
          fi

          if [[ "${SOURCE_BRANCH}" == "develop" ]]; then
            echo "Allowed: develop can be promoted to main."
            exit 0
          fi

          if [[ "${SOURCE_BRANCH}" == chore/promote-* ]]; then
            echo "Allowed: promotion branch can target main."
            exit 0
          fi

          echo "::error::Pull requests targeting main must come from develop or a chore/promote-* branch."
          echo "::error::Feature, fix, docs, ci, refactor, security, and test branches must target develop first."
          exit 1
