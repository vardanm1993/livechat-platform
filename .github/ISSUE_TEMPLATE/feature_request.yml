name: Feature request
description: Suggest a product or technical improvement.
title: "Feature: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the value of the feature and the problem it solves.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem should this feature solve?
      placeholder: Users need to...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the proposed behavior or implementation direction.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe alternative approaches if any.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Authentication
        - Account / Profile
        - Spaces / Rooms
        - Messaging
        - Realtime
        - Attachments / Media
        - Notifications
        - Calls / Video
        - Security
        - Billing
        - AI
        - Multilingual / i18n
        - API / Mobile
        - Documentation
        - Developer Experience
        - Other
    validations:
      required: true
