name: Documentation
description: Report missing, outdated, or unclear documentation.
title: "Docs: "
labels: ["documentation"]
body:
  - type: textarea
    id: issue
    attributes:
      label: Documentation issue
      description: What is missing, outdated, or unclear?
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: Location
      description: Link or path to the relevant document if known.
      placeholder: docs/architecture/overview.md
    validations:
      required: false

  - type: textarea
    id: improvement
    attributes:
      label: Suggested improvement
      description: Describe what should be added or changed.
    validations:
      required: false
